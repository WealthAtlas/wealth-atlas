name: Build and Deploy to wealthatlas.github.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check, lint, format check
        run: pnpm run quality

      - name: Build
        env:
          # ensure base is '/'
          VITE_BASE_OVERRIDE: /
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm run build && cp dist/index.html dist/404.html && touch dist/.nojekyll

    - name: Deploy to GitHub Pages repo
        uses: peaceiris/actions-gh-pages@v3
        with:
      external_repository: ${{ secrets.PAGES_EXTERNAL_REPO || format('{0}/{0}.github.io', github.repository_owner) }}
      publish_branch: ${{ secrets.PAGES_BRANCH || 'main' }}
          publish_dir: ./dist
          personal_token: ${{ secrets.GH_PAT }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
